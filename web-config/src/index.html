<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenNerfESC - Work in progress</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      main {
        width: min(720px, 92vw);
        padding: 2rem;
        border-radius: 14px;
        background: #1f2937;
        border: 1px solid #374151;
      }

      h1 {
        margin-top: 0;
      }

      .status {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.35rem 0.65rem;
        border-radius: 999px;
        font-weight: 600;
        color: #111827;
        background: #fbbf24;
      }

      a {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenNerfESC</h1>
      <p>Otwartoźródłowy sterownik PWM do wyrzutni strzałkowych Flywheel.</p>
      <p class="status">Work in progress</p>
      <p>
        Repozytorium:
        <a href="https://github.com/RadzuPL/OpenNerfESC">github.com/RadzuPL/OpenNerfESC</a>
      </p>
    </main>
  </body>
</html>
