<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenNerfESC Configurator</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117; color: #c9d1d9;
    }
    main {
      width: min(540px, 96vw);
      padding: 1.8rem 2rem 2rem;
      border-radius: 14px;
      background: #161b22;
      border: 1px solid #30363d;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.2rem;
    }
    h1 { margin: 0; font-size: 1.3rem; color: #58a6ff; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .lang-btn {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.25rem 0.55rem;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .lang-btn:hover { background: #30363d; color: #e6edf3; }
    .status {
      display: inline-block;
      margin: 0.9rem 0 1.4rem;
      padding: 0.3rem 0.8rem;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      background: #21262d; color: #8b949e;
    }
    .status.connected { background: #0f3d2e; color: #3fb950; }
    .status.error     { background: #3d1b1b; color: #f85149; }
    .param { margin-bottom: 1.3rem; }
    .param label {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      margin-bottom: 0.35rem;
      color: #c9d1d9;
    }
    .param label span {
      font-weight: 700;
      color: #58a6ff;
      min-width: 7ch;
      text-align: right;
    }
    input[type=range] { width: 100%; accent-color: #3b82f6; }
    .btn-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.8rem;
    }
    button {
      flex: 1;
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.35; cursor: default; }
    #btn-connect { background: #1f6feb; color: #fff; }
    #btn-connect:hover:not(:disabled) { background: #388bfd; }
    #btn-send    { background: #238636; color: #fff; }
    #btn-send:hover:not(:disabled)    { background: #2ea043; }
    #log {
      margin-top: 1.2rem;
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.75rem;
      color: #8b949e;
      font-family: monospace;
      line-height: 1.6;
    }
    footer {
      margin-top: 1rem;
      color: #6e7681;
      font-size: 0.78rem;
      text-align: center;
    }
    footer a { color: #58a6ff; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>OpenNerfESC</h1>
      <div class="header-right">
        <button class="lang-btn" id="btn-lang" title="Switch language / Zmień język">PL</button>
      </div>
    </header>

    <span id="status" class="status" data-i18n="disconnected">Disconnected</span>

    <div class="param">
      <label>
        <span data-i18n="label_spin">Spin-up time</span>
        <span id="spin-value" data-i18n-title="tip_spin">200 ms</span>
      </label>
      <input id="input-spin-up-time" type="range" min="0" max="500" step="10" value="200" data-i18n-title="tip_spin" />
    </div>

    <div class="param">
      <label>
        <span data-i18n="label_rearm">Spin-up rearm time</span>
        <span id="rearm-value" data-i18n-title="tip_rearm">3000 ms</span>
      </label>
      <input id="input-spin-up-rearm-time" type="range" min="0" max="5000" step="50" value="3000" data-i18n-title="tip_rearm" />
    </div>

    <div class="param">
      <label>
        <span data-i18n="label_retrigger_spin">Quick re-trigger spin-up</span>
        <span id="retrigger-spin-value" data-i18n-title="tip_retrigger_spin">50 ms</span>
      </label>
      <input id="input-retrigger-spin-up-time" type="range" min="0" max="100" step="1" value="50" data-i18n-title="tip_retrigger_spin" />
    </div>

    <div class="param">
      <label>
        <span data-i18n="label_speed">Target speed</span>
        <span id="speed-value" data-i18n-title="tip_speed">75%</span>
      </label>
      <input id="input-target-speed" type="range" min="0" max="100" step="1" value="75" data-i18n-title="tip_speed" />
    </div>

    <div class="param">
      <label>
        <span data-i18n="label_volt">Min. voltage</span>
        <span id="voltage-value" data-i18n-title="tip_volt">11.1 V</span>
      </label>
      <input id="input-min-voltage" type="range" min="3.0" max="15.0" step="0.1" value="11.1" data-i18n-title="tip_volt" />
    </div>

    <div class="param">
      <label>
        <span data-i18n="label_battery_voltage">Battery voltage (read-only)</span>
        <span id="battery-voltage-value" data-i18n-title="tip_battery">--.- V</span>
      </label>
      <button id="btn-read-battery" disabled data-i18n="btn_read_battery" data-i18n-title="tip_battery">Read battery voltage</button>
    </div>

    <div class="btn-row">
      <button id="btn-connect" data-i18n="btn_connect">Connect to ESC</button>
      <button id="btn-send" disabled data-i18n="btn_send">Send parameters</button>
    </div>

    <div id="log"></div>
  </main>
  <footer>
    Source code on <a href="https://github.com/RadzuPL/OpenNerfESC" target="_blank" rel="noopener">GitHub</a>.<br>
    Build: <span id="build-info">__BUILD_COMMIT__ &mdash; __BUILD_TIME__</span>
  </footer>
<script src="app.js?v=__BUILD_COMMIT__"></script>
</body>
</html>
