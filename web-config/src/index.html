<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenNerfESC Konfigurator</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif;
      background: #111827; color: #f9fafb;
    }
    main {
      width: min(520px, 94vw);
      padding: 2rem;
      border-radius: 14px;
      background: #1f2937;
      border: 1px solid #374151;
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    .status {
      display: inline-block;
      margin-bottom: 1.5rem;
      padding: 0.3rem 0.8rem;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #374151; color: #9ca3af;
    }
    .status.connected { background: #064e3b; color: #34d399; }
    .status.error     { background: #4c0519; color: #fb7185; }
    .param {
      margin-bottom: 1.4rem;
    }
    .param label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: #d1d5db;
    }
    .param label span {
      font-weight: 700;
      color: #60a5fa;
      min-width: 6ch;
      text-align: right;
    }
    input[type=range] {
      width: 100%;
      accent-color: #3b82f6;
    }
    .btn-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.8rem;
    }
    button {
      flex: 1;
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.35; cursor: default; }
    #btn-connect { background: #2563eb; color: #fff; }
    #btn-connect:hover:not(:disabled) { background: #1d4ed8; }
    #btn-send    { background: #059669; color: #fff; }
    #btn-send:hover:not(:disabled)    { background: #047857; }
    #log {
      margin-top: 1.4rem;
      max-height: 140px;
      overflow-y: auto;
      font-size: 0.78rem;
      color: #6b7280;
      font-family: monospace;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<main>
  <h1>OpenNerfESC Konfigurator</h1>
  <span id="status" class="status">Rozłączono</span>

  <div class="param">
    <label>
      Czas rozbiegu (spinUpTime)
      <span id="spin-value">500 ms</span>
    </label>
    <input id="input-spin-up-time" type="range"
           min="0" max="5000" step="50" value="500" />
  </div>

  <div class="param">
    <label>
      Prędkość docelowa (targetSpeed)
      <span id="speed-value">75%</span>
    </label>
    <input id="input-target-speed" type="range"
           min="0" max="100" step="1" value="75" />
  </div>

  <div class="param">
    <label>
      Min. napięcie (minVoltage)
      <span id="voltage-value">6.0 V</span>
    </label>
    <input id="input-min-voltage" type="range"
           min="3.0" max="25.0" step="0.1" value="6.0" />
  </div>

  <div class="btn-row">
    <button id="btn-connect">Połącz z ESC</button>
    <button id="btn-send" disabled>Wyślij parametry</button>
  </div>

  <div id="log"></div>
</main>
<script src="app.js"></script>
</body>
</html>
