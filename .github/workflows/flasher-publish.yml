name: Publish Web Flasher Docker image

# Triggered by: push to web-flasher/**, after firmware build completes, or workflow_dispatch
on:
  push:
    branches: [main]
    paths:
      - 'web-flasher/**'
      - '.github/workflows/flasher-publish.yml'
  workflow_run:
    workflows: ["Build and Release Firmware"]
    types: [completed]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest firmware binaries
        id: firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" || echo "")
          TAG=$(echo "$RELEASE" | jq -r '.[0].tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "No release found – building flasher without firmware binaries."
            echo "tag=none" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            mkdir -p web-flasher/firmware
            BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
            for BOARD in esp32-c3-supermini esp32-c6-supermini; do
              for FILE in bootloader partitions firmware; do
                curl -fL "$BASE/$FILE-$BOARD.bin" -o "web-flasher/firmware/$FILE-$BOARD.bin"
              done
            done
            echo "$TAG" > web-flasher/firmware/version.txt
            # Patch manifest versions to match the baked release
            for F in web-flasher/manifests/manifest-esp32c3.json web-flasher/manifests/manifest-esp32c6.json; do
              jq --arg v "$TAG" '.version = $v' "$F" > "$F.tmp" && mv "$F.tmp" "$F"
            done
          fi

      - name: Inject build info into index.html
        run: |
          COMMIT="${{ github.sha }}"
          SHORT="${COMMIT:0:7}"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sed -i "s|__BUILD_COMMIT__|${SHORT}|g" web-flasher/index.html
          sed -i "s|__BUILD_TIME__|${BUILD_TIME}|g" web-flasher/index.html

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennerfesc-flasher
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./web-flasher
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
