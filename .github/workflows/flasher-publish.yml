name: Publish Web Flasher Docker image

# Triggered by: push to web-flasher/**, after firmware build completes, or workflow_dispatch
on:
  push:
    branches: [main]
    paths:
      - 'web-flasher/**'
      - '.github/workflows/flasher-publish.yml'
  workflow_run:
    workflows: ["Build and Release Firmware"]
    types: [completed]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    # Skip this job when triggered by a failed firmware build.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware binaries
        id: firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p web-flasher/firmware

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Download directly from the artifacts of the triggering firmware build run.
            # This ensures the flasher always ships the binaries that were just built,
            # even before a GitHub Release is created.
            RUN_ID="${{ github.event.workflow_run.id }}"
            VERSION="${{ github.event.workflow_run.head_sha }}"
          else
            # For push / workflow_dispatch: use latest successful firmware-build run.
            RUNS_JSON=$(gh api \
              "/repos/${{ github.repository }}/actions/workflows/firmware-build.yml/runs?branch=main&per_page=20")
            RUN_ID=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' | head -n 1)
            VERSION=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[] | select(.conclusion == "success") | .head_sha' | head -n 1)
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ] || [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "No successful firmware-build workflow run found on main."
              exit 1
            fi
          fi

          echo "Downloading artifacts from workflow run $RUN_ID"
          for BOARD in esp32-c3-supermini esp32-c6-supermini; do
            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              -n "firmware-$BOARD" \
              -D "web-flasher/firmware/"
          done

          VERSION="${VERSION:0:7}"
          echo "$VERSION" > web-flasher/firmware/version.txt
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

          # Patch manifest versions to match whatever was baked in.
          VERSION=$(cat web-flasher/firmware/version.txt 2>/dev/null || echo "dev")
          for F in web-flasher/manifests/manifest-esp32c3.json web-flasher/manifests/manifest-esp32c6.json; do
            jq --arg v "$VERSION" '.version = $v' "$F" > "$F.tmp" && mv "$F.tmp" "$F"
          done

      - name: Inject build info into index.html
        run: |
          COMMIT="${{ github.sha }}"
          SHORT="${COMMIT:0:7}"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sed -i "s|__BUILD_COMMIT__|${SHORT}|g" web-flasher/index.html
          sed -i "s|__BUILD_TIME__|${BUILD_TIME}|g" web-flasher/index.html

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennerfesc-flasher
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./web-flasher
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
