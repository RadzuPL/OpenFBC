name: Publish Web Config Docker image

on:
  push:
    paths:
      - 'web-config/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openfbc-web-config
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Inject build info into index.html
        run: |
          COMMIT="${{ github.sha }}"
          SHORT="${COMMIT:0:7}"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sed -i "s|__BUILD_COMMIT__|${SHORT}|g" web-config/src/index.html
          sed -i "s|__BUILD_TIME__|${BUILD_TIME}|g" web-config/src/index.html

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: web-config
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
