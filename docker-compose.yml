version: '3.8'

services:
  web-flasher:
    image: ghcr.io/radzupl/openfbc-flasher:latest
    container_name: openfbc-flasher
    restart: unless-stopped
    ports:
      - "8322:8080"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Optional: Watchtower for auto-updates when new image is pushed
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-flasher
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
    command: --interval 300 --label-enable
