; OpenNerfESC - platformio.ini
; See /docs/CODING_GUIDELINES.md for project conventions.

[env:esp32c6-test]
; --- Test environment: ESP32-C6 Super Mini ---
; Used for BLE transfer testing before final ESP32-C3 production build.
; Requires pioarduino platform (Arduino core 3.x) and NimBLE-Arduino 2.x for ESP32-C6.
; Many ESP32-C6 Super Mini boards ship with 4MB flash (FH4 package). Force 4MB image header.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board       = esp32-c6-devkitc-1
board_build.mcu   = esp32c6
board_build.f_cpu = 160000000L
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = huge_app.csv
framework = arduino
build_type = debug
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -D DEBUG_MODE=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I src
lib_ldf_mode = chain+
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.2

[env:esp32c3-prod]
; --- Production environment: ESP32-C3 Super Mini ---
; Uses pioarduino 53.03.10 (Arduino Core 3.x) - version 54.03.20 has a broken
; postinstall script for the ESP32-C3 toolchain package (missing package-postinstall.py).
; TODO: Migrate to official espressif32 platform once Arduino Core 3.x lands in PlatformIO registry.
; DEBUG_MODE=0 for release build (no Serial output, smaller binary).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board       = esp32-c3-devkitm-1
board_build.mcu   = esp32c3
board_build.f_cpu = 160000000L
framework = arduino
monitor_speed = 115200
build_flags =
  -D DEBUG_MODE=0
  -D ARDUINO_USB_MODE=1
  -I src
lib_ldf_mode = chain+
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.2
