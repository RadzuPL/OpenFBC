; OpenNerfESC - platformio.ini
; See /docs/CODING_GUIDELINES.md for project conventions.

[env:esp32c6-test]
; --- Test environment: ESP32-C6 Super Mini ---
; Used for BLE transfer testing before final ESP32-C3 production build.
; ESP32-C6 requires espressif32 >= 6.5.0 for Arduino framework support.
platform  = espressif32@6.9.0
board     = esp32-c6-devkitc-1
board_build.mcu       = esp32c6
board_build.f_cpu     = 160000000L
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -D DEBUG_MODE=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3

[env:esp32c3-prod]
; --- Production environment: ESP32-C3 Super Mini ---
; DEBUG_MODE=0 for release build (no Serial output, smaller binary).
platform  = espressif32
board     = esp32-c3-devkitm-1
board_build.mcu       = esp32c3
board_build.f_cpu     = 160000000L
framework = arduino
monitor_speed = 115200
build_flags =
  -D DEBUG_MODE=0
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3
